  <head>

    <!-- ═══════════════════════════════════════════════════
         PRIMARY SEO

    ═══════════════════════════════════════════════════ -->
    <title>Delci — Official Site | Singer, Songwriter &amp; Producer | Ice Cream &amp; Tempted</title>

    <meta name="theme-color" content="#3D1F08" />

    <!-- ═══════════════════════════════════════════════════
         rel="me" — CRITICAL for Google entity verification.
         Each link corroborates that delcimusic.com = Delci
         the artist. This is what builds the Knowledge Panel.
    ═══════════════════════════════════════════════════ -->
    <link rel="me" href="https://www.instagram.com/delcimusic" />

    <link rel="me" href="https://linktr.ee/delcimusic" />

    <!-- ═══════════════════════════════════════════════════
         JSON-LD STRUCTURED DATA
         This is what Google reads to build the Knowledge Panel.
         MusicGroup + two MusicRecording + WebSite + Person entities.
         The @id URIs tie everything together into one entity graph.
    ═══════════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [

        {
          "@type": "MusicGroup",
          "@id": "https://delcimusic.com/#delci",
          "name": "Delci",
          "alternateName": [
            "delcimusic",
            "Delci Music",
            "@delcimusic"
          ],
          "url": "https://delcimusic.com",
          "description": "Delci is an independent euphoric pop and R&B singer, songwriter, record producer, multi-instrumentalist, vocalist, and recording artist known for the singles Ice Cream and Tempted. New music coming 2026. Follow @delcimusic on Instagram, TikTok, Spotify, Apple Music, Amazon Music and iHeart.",
          "knowsAbout": ["songwriting", "music production", "vocals", "instrumentation", "recording"],
          "hasOccupation": [
            { "@type": "Occupation", "name": "Singer" },
            { "@type": "Occupation", "name": "Songwriter" },
            { "@type": "Occupation", "name": "Record Producer" },
            { "@type": "Occupation", "name": "Multi-instrumentalist" },
            { "@type": "Occupation", "name": "Vocalist" },
            { "@type": "Occupation", "name": "Recording Artist" }
          ],
          "genre": ["Pop", "R&B", "Euphoric Pop", "Indie Pop", "Singer-Songwriter", "Independent", "Soul", "Alternative Pop"],
          "image": {
            "@type": "ImageObject",
            "url": "https://delcimusic.com/og-image.jpg",
            "width": 1200,
            "height": 630
          },
          "sameAs": [
            "https://delcimusic.com",
            "https://open.spotify.com/artist/264045j10lWRwqhUxKZBPP",
            "https://music.apple.com/us/artist/delci/1648386915",
            "https://music.amazon.com/artists/B0BHC5PBYP/delci",
            "https://www.iheart.com/artist/delci-38926064/",
            "https://www.instagram.com/delcimusic",
            "https://www.tiktok.com/@delcimusic",
            "https://www.youtube.com/@delcimusic",
            "https://linktr.ee/delcimusic"
          ],
          "track": [
            { "@id": "https://delcimusic.com/#ice-cream" },
            { "@id": "https://delcimusic.com/#tempted" }
          ]
        },

        {
          "@type": "MusicRecording",
          "@id": "https://delcimusic.com/#ice-cream",
          "name": "Ice Cream",
          "alternateName": "Ice Cream by Delci",
          "byArtist": { "@id": "https://delcimusic.com/#delci" },
          "url": "https://open.spotify.com/artist/264045j10lWRwqhUxKZBPP",
          "description": "Ice Cream is a single by Delci, available on Spotify, Apple Music, Amazon Music and iHeart.",
          "inAlbum": {
            "@type": "MusicAlbum",
            "name": "Ice Cream",
            "albumProductionType": "SingleRelease",
            "byArtist": { "@id": "https://delcimusic.com/#delci" }
          }
        },

        {
          "@type": "MusicRecording",
          "@id": "https://delcimusic.com/#tempted",
          "name": "Tempted",
          "alternateName": "Tempted by Delci",
          "byArtist": { "@id": "https://delcimusic.com/#delci" },
          "url": "https://open.spotify.com/artist/264045j10lWRwqhUxKZBPP",
          "description": "Tempted is a single by Delci, available on Spotify, Apple Music, Amazon Music and iHeart.",
          "inAlbum": {

            "albumProductionType": "SingleRelease",
            "byArtist": { "@id": "https://delcimusic.com/#delci" }
          }
        },

        {
          "@type": "WebSite",
          "@id": "https://delcimusic.com/#website",
          "url": "https://delcimusic.com",
          "name": "Delci — Official Site",
          "description": "The official website of Delci (@delcimusic) — singer, songwriter, producer and multi-instrumentalist. Stream Ice Cream and Tempted. New music coming 2026.",
          "publisher": { "@id": "https://delcimusic.com/#delci" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://delcimusic.com/?s={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },

        {
          "@type": "BreadcrumbList",
          "@id": "https://delcimusic.com/#breadcrumb",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Delci",

            }
